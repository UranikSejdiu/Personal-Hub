name: Android compiler cache
description: Restore a separate C++ compiler cache for each Android app
inputs:
  app:
    description: App cache namespace
    required: true
  fingerprint:
    description: Dependency and native build configuration hash
    required: true
outputs:
  path:
    description: Compiler cache directory
    value: ${{ runner.temp }}/ccache/${{ inputs.app }}
  key:
    description: Immutable cache key for this commit
    value: ${{ steps.restore.outputs.cache-primary-key }}
  hit:
    description: Whether this exact cache already exists
    value: ${{ steps.restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Install compiler cache
      shell: bash
      run: |
        if ! command -v ccache >/dev/null 2>&1; then
          sudo apt-get update -qq
          sudo apt-get install -y ccache
        fi
    - name: Configure compiler cache
      shell: bash
      env:
        CACHE_DIRECTORY: ${{ runner.temp }}/ccache/${{ inputs.app }}
      run: |
        mkdir -p "$CACHE_DIRECTORY"
        printf 'CCACHE_DIR=%s\nCCACHE_BASEDIR=%s\nCCACHE_COMPILERCHECK=content\nCCACHE_MAXSIZE=1G\n' \
          "$CACHE_DIRECTORY" "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
    - name: Restore compiler cache
      id: restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/ccache/${{ inputs.app }}
        key: android-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.app }}-${{ inputs.fingerprint }}-${{ github.sha }}
        restore-keys: |
          android-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.app }}-${{ inputs.fingerprint }}-
          android-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.app }}-
    - name: Reset compiler cache statistics
      shell: bash
      run: ccache --zero-stats
