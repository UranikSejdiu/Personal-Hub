name: Repository release configuration

on:
  push:
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "package*.json"
      - "apps/*/app.json"
      - "apps/*/package*.json"
      - "apps/*/src/appIdentity.json"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline
      - run: npm run check:releases
