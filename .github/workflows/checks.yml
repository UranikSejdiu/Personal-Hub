name: Quality Checks

on:
  push:
    # Main builds already call this workflow; avoid a duplicate checks run.
    branches: ["**", "!main"]
    paths-ignore:
      - "apps/dhikr/**"
      - "**/*.md"
      - ".github/workflows/build-dhikr.yml"
      - ".github/workflows/dhikr-checks.yml"
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-checks-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Validate types, lint, data behavior, and theme contrast
        run: npm run validate

      - name: Verify Expo configuration
        run: npx expo config --type public

      - name: Bundle Android and iOS
        run: npm run bundle:check
