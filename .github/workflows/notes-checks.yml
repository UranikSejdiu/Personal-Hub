name: Notes Quality Checks

on:
  push:
    branches: ["**", "!main"]
    paths: ["apps/notes/**", ".github/workflows/notes-checks.yml", ".github/workflows/build-notes.yml", ".github/actions/android-cache/**"]
  pull_request:
    paths: ["apps/notes/**", ".github/workflows/notes-checks.yml", ".github/workflows/build-notes.yml", ".github/actions/android-cache/**"]
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-checks-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
    defaults:
      run:
        working-directory: apps/notes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/notes/.nvmrc
          cache: npm
          cache-dependency-path: apps/notes/package-lock.json
      - run: npm ci --prefer-offline
      - run: npm run validate
      - run: npx expo config --type public
      - run: npm run bundle:check
