name: Build Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  build:
    needs: checks
    runs-on: ubuntu-latest
    env:
      CI: true
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Verify release tag matches the app version
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release-tag.cjs

      - name: Create keystore and properties from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/release-keystore.jks
          printf 'STORE_PASSWORD=%s\nKEY_ALIAS=%s\nKEY_PASSWORD=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/keystore.properties
          test -s android/release-keystore.jks
          test -s android/keystore.properties
          chmod 600 android/release-keystore.jks android/keystore.properties

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Sync Android version from package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          CODE=$(node -p "require('./app.json').expo.android.versionCode")
          echo "Syncing Android to $VERSION ($CODE) from package.json"
          sed -i "s/versionCode [0-9]*/versionCode $CODE/" android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Build release APK
        run: cd android && ./gradlew assembleRelease --profile

      - name: Upload Gradle profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-profile
          path: android/build/reports/profile/*.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Hub APK
        uses: actions/upload-artifact@v4
        with:
          name: Personal-Hub-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: Personal Hub ${{ github.ref_name }}
          body: |
            Install app-release.apk to update Personal Hub.
            Dhikr is now a separate app with separate releases and backups.
            Before updating an older Hub with Dhikr counts, export its backup and import it into standalone Dhikr.
            Release and signing instructions: https://github.com/UranikSejdiu/Personal-Hub/blob/main/.github/RELEASING.md
          fail_on_unmatched_files: true
          files: android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
